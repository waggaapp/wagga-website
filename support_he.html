
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>תמיכה ב-Wagga</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 24px;
            background: #ffffff;
            color: #252a28;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            font-size: 18px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            text-align: center;
        }

        .logo {
            margin: 0 0 30px;
            color: #24743c;
            font-size: clamp(48px, 9vw, 76px);
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 1.15;
            direction: ltr;
        }

        .intro {
            max-width: 680px;
            margin: 0 auto 36px;
            color: #424946;
            font-size: clamp(19px, 3vw, 23px);
            line-height: 1.65;
        }

        .contact {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin: 0 0 30px;
            padding: 24px;
            border-radius: 18px;
            background: #f0f7ef;
            color: #244f32;
            font-size: clamp(18px, 3vw, 22px);
        }

        .contact-label {
            font-weight: 700;
        }

        .contact a {
            color: #24743c;
            font-weight: 650;
            text-decoration: none;
            overflow-wrap: anywhere;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        .contact a:focus-visible {
            outline: 3px solid #24743c;
            outline-offset: 4px;
            border-radius: 3px;
        }

        .closing {
            margin: 0;
            color: #424946;
            font-size: clamp(18px, 3vw, 22px);
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            body {
                padding: 40px 20px;
            }

            .logo {
                margin-bottom: 28px;
            }

            .contact {
                padding: 22px 16px;
                gap: 2px 8px;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="logo" aria-label="Wagga">Wagga</div>

        <p class="intro">
            אם יש לכם שאלות או הערות, נתקלתם בבעיה או שאתם רוצים
            לדווח על באג, אתם מוזמנים ליצור איתנו קשר בדוא"ל.
        </p>

        <div class="contact">
            <span class="contact-label">דוא"ל:</span>
            <a href="mailto:wagga.app@gmail.com">wagga.app@gmail.com</a>
        </div>

        <p class="closing">
            נשמח לקבל משוב והצעות לשיפור Wagga.
        </p>
    </main>
</body>
</html>
